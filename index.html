
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Confession 😏</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #160b18;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #ff69a4;
            font-size: clamp(25px, 5vw, 36px);
        }

        h2 {
            font-size: clamp(19px, 4vw, 26px);
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 35px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.08);
            background: #ff69a4;
        }

        #confession {
            display: none;
            margin-top: 35px;
            animation: pop 1s ease;
        }

        #confession h1 {
            margin: 20px 0;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 20px;
            }

            button {
                width: 100%;
                max-width: 320px;
                padding: 18px 15px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤫 I HAVE A CONFESSION...</h1>

    <h2>I've been keeping something from you.</h2>

    <p>Do you really want to know? 😏</p>

    <button onclick="reveal()">
        REVEAL MY CONFESSION ❤️
    </button>

    <div id="confession">

        <h1>OKAY... HERE IT IS! 😭</h1>

        <h2>I STOLE SOMETHING FROM YOU!</h2>

        <h1>YOUR ATTENTION! 😂💀</h1>

        <p>And honestly...</p>

        <h2>I'm not giving it back. 😘</h2>

        <p>Have a beautiful day, troublemaker. ❤️</p>

    </div>

</div>

<script>
    function reveal() {
        document.getElementById("confession").style.display = "block";
    }
</script>

</body>
</html>
